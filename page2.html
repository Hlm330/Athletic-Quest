<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athletic Quest</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="header-page2">
        <a href="index.html">
            <img src="Images/Logo projet sans fond.png" alt="Logo Athletic Quest" class="logo-page2">
        </a>
        <h1 class="titre-page2">
            <span class="bleu">A</span>thletic  
            <span class="orange">Q</span>uest
        </h1>
    </header>

    <main class="flex-container">
        <section class="card histoire-card">
            <img src="Images/Histoire athlétisme.jpg" alt="Histoire de l'athlétisme">
            <h2>Histoire</h2>
        </section>
        
        <section class="card discipline-card">
            <img src="Images/Discipline athlé.png" alt="Disciplines de l'athlétisme">
            <h2>Discipline</h2>
        </section>
    
        <section class="card competition-card">
            <img src="Images/Type compétition.png" alt="Types de compétitions">
            <h2>Compétitions</h2>
        </section>
    </main>    

    <div class="liens-container">
        <a href="https://www.athle.fr/index.aspx" target="_blank">
            <img src="Images/FFA.png" alt="Fédération Française d'Athlétisme">
        </a>
        <a href="https://worldathletics.org/" target="_blank">
            <img src="Images/World Athletics.png" alt="World Athletics">
        </a>
        <a href="https://athlelana.com/" target="_blank">
            <img src="Images/LANA.png" alt="Ligue Nouvelle-Aquitaine Athlétisme">
        </a>
        <a href="http://comite33.athle.fr/asp.net/espaces.home/home.aspx" target="_blank">
            <img src="Images/CD33.gif" alt="Comité Gironde Athlétisme">
        </a>
    </div>
    

</body>
</html>
